<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YKPI Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #F8FCFD, #FFFFFF);
      color: #12373B;
    }
    .card {
      width: min(420px, 100%);
      padding: 26px;
      border-radius: 24px;
      background: white;
      border: 1px solid #D8ECEE;
      box-shadow: 0 24px 70px rgba(17, 88, 94, .14);
      text-align: center;
    }
    h1 { color: #0F7E82; margin: 0 0 8px; }
    p { color: #64748b; line-height: 1.65; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Internet Terputus</h1>
    <p>Aplikasi membutuhkan koneksi internet untuk membuka server Apps Script.</p>
  </div>
</body>
</html>
